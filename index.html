<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f5efe4" />
  <title>東京 6天5夜｜2026.10.14–10.19</title>
  <style>
    :root{
      --paper:#f5efe4; --paper2:#fbf8f1; --card:#fffdf8; --ink:#28251f; --muted:#7a756d;
      --line:#ded5c7; --red:#9d4b43; --red2:#ba695d; --green:#54685b; --blue:#5e7077;
      --shadow:0 12px 32px rgba(52,42,28,.09); --radius:22px;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth;overflow-x:hidden}
    body{margin:0;color:var(--ink);background:
      radial-gradient(circle at 15% 10%,rgba(157,75,67,.05),transparent 22%),
      radial-gradient(circle at 85% 28%,rgba(84,104,91,.06),transparent 24%),
      linear-gradient(180deg,#f8f2e7 0%,var(--paper) 48%,#f1eadf 100%);
      font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.65}
    a{color:inherit;text-decoration:none}
    button{font:inherit}
    img,iframe,svg{max-width:100%}
    .wrap{width:100%;max-width:1220px;margin:0 auto;padding:0 22px;min-width:0}

    /* Japanese travel postcard hero */
    header{position:relative;overflow:hidden;background:#ebe4d7;border-bottom:1px solid var(--line);padding:44px 0 34px}
    .sun{position:absolute;width:260px;height:260px;border-radius:50%;right:-70px;top:-95px;background:rgba(157,75,67,.10);box-shadow:0 0 0 18px rgba(157,75,67,.04),0 0 0 40px rgba(157,75,67,.025)}
    .mountains{position:absolute;left:-40px;right:-40px;bottom:-46px;height:120px;opacity:.16;background:linear-gradient(135deg,transparent 0 30%,#7d8d80 30% 54%,transparent 54% 100%),linear-gradient(30deg,transparent 0 48%,#8a6e61 48% 70%,transparent 70% 100%);transform:skewX(-18deg)}
    .hero{display:flex;justify-content:space-between;gap:28px;align-items:flex-end;position:relative;z-index:1}
    .hero-copy{max-width:760px}
    .eyebrow{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--red);font-weight:800;margin-bottom:8px}
    h1{font-family:Georgia,"Times New Roman","Noto Serif TC",serif;margin:0;font-size:clamp(36px,6vw,66px);line-height:1.05;letter-spacing:-.03em}
    .lead{margin:12px 0 0;color:#5e5a53;font-size:15px}
    .hero-card{min-width:280px;background:rgba(255,253,248,.76);border:1px solid rgba(127,109,88,.2);backdrop-filter:blur(10px);border-radius:24px;padding:18px 20px;box-shadow:var(--shadow)}
    .hero-card .stamp{display:inline-flex;align-items:center;justify-content:center;width:54px;height:54px;border:2px solid var(--red);border-radius:50%;color:var(--red);font-weight:900;transform:rotate(-8deg);margin-bottom:8px;font-size:12px}
    .hero-card strong{display:block;font-size:21px;letter-spacing:.03em}.hero-card small{display:block;color:var(--muted);margin-top:2px}

    /* sticky day nav */
    .toolbar{position:sticky;top:0;z-index:30;background:rgba(248,242,231,.9);backdrop-filter:blur(12px);border-bottom:1px solid rgba(222,213,199,.9)}
    .toolbar-inner{display:flex;gap:8px;overflow:auto;padding:12px 0;scrollbar-width:none}.toolbar-inner::-webkit-scrollbar{display:none}
    .day-btn{border:1px solid var(--line);background:rgba(255,253,248,.9);color:var(--ink);padding:10px 14px;border-radius:999px;white-space:nowrap;cursor:pointer;transition:.2s;box-shadow:0 2px 0 rgba(0,0,0,.02)}
    .day-btn:hover{transform:translateY(-1px)} .day-btn.active{background:var(--ink);color:#fff;border-color:var(--ink)}

    main{padding:26px 0 70px}.panel{display:none}.panel.active{display:block}.grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(320px,.75fr);gap:22px}
    .card{background:rgba(255,253,248,.94);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px}
    .card + .card{margin-top:18px}
    .day-title{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:8px}.day-title h2{font-family:Georgia,"Times New Roman","Noto Serif TC",serif;margin:0;font-size:30px;line-height:1.2}.sub{color:var(--muted);font-size:14px}.badge{white-space:nowrap;background:#eee7db;border:1px solid #dfd4c6;padding:5px 10px;border-radius:999px;font-size:12px;color:#61594f}

    /* timeline */
    .route{position:relative;margin-top:20px}.route:before{content:"";position:absolute;left:101px;top:17px;bottom:22px;width:1px;background:var(--line)}
    .stop{display:grid;grid-template-columns:90px 1fr;gap:24px;position:relative;padding:0 0 24px}.time{font-size:13px;font-weight:800;color:var(--red);padding-top:2px;text-align:right;letter-spacing:.01em}.dot{position:absolute;left:95px;top:2px;width:13px;height:13px;border:3px solid var(--ink);background:var(--card);border-radius:50%;z-index:2}.stop-body{padding-left:10px}.stop-title{font-size:17px;font-weight:800}.stop-note{font-size:14px;color:#625e57;margin-top:2px}.tag{display:inline-block;background:#f2ece2;border:1px solid #e4dacb;border-radius:999px;padding:3px 8px;font-size:11px;margin:7px 6px 0 0;color:#685f53}

    /* map */
    .map-card{padding:0;overflow:hidden}.map-head{padding:18px 20px 10px;display:flex;justify-content:space-between;gap:12px;align-items:flex-end}.map-head h3{margin:0;font-family:Georgia,"Times New Roman","Noto Serif TC",serif;font-size:22px}.map-head small{color:var(--muted)}
    .gmaps-wrap{position:relative;width:100%;height:360px;background:#e9e3d9}.gmaps-wrap iframe{width:100%;height:100%;border:0;display:block}.map-overlay{position:absolute;left:14px;bottom:14px;z-index:2;background:rgba(255,253,248,.94);border:1px solid rgba(127,109,88,.2);border-radius:999px;padding:7px 10px;font-size:11px;color:var(--muted);box-shadow:0 4px 12px rgba(52,42,28,.08);pointer-events:none}
    .map-foot{padding:12px 16px 16px;display:flex;gap:8px;flex-wrap:wrap}.map-link{display:inline-flex;align-items:center;gap:6px;padding:8px 10px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:12px}.map-link:hover{border-color:#b8a894;background:#fbf8f1}

    .side-stack{display:grid;gap:18px;align-content:start}.side-card h3{margin:0 0 10px;font-family:Georgia,"Times New Roman","Noto Serif TC",serif;font-size:21px}.side-card p{margin:6px 0}.notice{background:#faf0ea;border:1px solid #e7cbc1;color:#69423b;border-radius:16px;padding:13px 14px;font-size:14px}.soft{background:#eef1eb;border-color:#d6dfd7;color:#4f5d53}
    .checklist{display:grid;gap:9px;margin-top:10px}.check{display:flex;align-items:flex-start;gap:9px;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:#fffefa}.check input{margin-top:4px;accent-color:var(--green)} .check.done{text-decoration:line-through;color:#969087;background:#f5f2eb}
    .shop{display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px 0;border-bottom:1px dashed var(--line)}.shop:last-child{border-bottom:0}.pill{font-size:11px;padding:4px 8px;border-radius:999px;background:#f0ebe2;color:#635b50;white-space:nowrap}
    .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{background:#faf7f0;border:1px solid var(--line);border-radius:15px;padding:12px}.stat b{display:block;font-size:18px}.stat span{font-size:11px;color:var(--muted)}
    .mini-table{width:100%;border-collapse:collapse;font-size:13px}.mini-table td{padding:8px 2px;border-bottom:1px solid var(--line)}.mini-table td:last-child{text-align:right;font-weight:800}
    .footer{color:var(--muted);font-size:12px;text-align:center;margin-top:30px}

    /* route strip */
    .route-strip{display:flex;align-items:center;gap:7px;overflow:auto;padding:5px 2px 2px;scrollbar-width:none}.route-strip::-webkit-scrollbar{display:none}.route-node{min-width:112px;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:#fffcf7;font-size:12px}.route-node b{display:block;font-size:13px}.route-arrow{color:#a08f7e;font-size:16px}
    .map-note{font-size:12px;color:var(--muted);margin-top:8px}


    /* expense tracker */
    .expense-card{margin-top:18px}
    .expense-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:14px;flex-wrap:wrap}
    .expense-head h3{margin:0;font-family:Georgia,"Times New Roman","Noto Serif TC",serif;font-size:24px}
    .expense-head p{margin:3px 0 0;color:var(--muted);font-size:13px}
    .people-editor{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
    .person-chip{display:flex;align-items:center;gap:6px;background:#fffaf2;border:1px solid var(--line);border-radius:999px;padding:5px 8px 5px 10px}
    .person-chip input{width:74px;border:0;background:transparent;outline:0;color:var(--ink);font-weight:700;font-size:12px;min-width:0}
    .person-chip button{border:0;background:transparent;color:#aa8f7b;cursor:pointer;font-size:14px;line-height:1;padding:2px}
    .expense-form{display:grid;grid-template-columns:minmax(170px,1.6fr) minmax(120px,.8fr) minmax(150px,.9fr) auto;gap:10px;align-items:end}
    .field label{display:block;font-size:11px;color:var(--muted);margin:0 0 5px 2px}
    .field input[type="text"],.field input[type="number"],.field select{width:100%;height:42px;border:1px solid var(--line);border-radius:12px;background:#fffefa;padding:0 12px;color:var(--ink);outline:none}
    .field input:focus,.field select:focus{border-color:#b8a894;box-shadow:0 0 0 3px rgba(157,75,67,.07)}
    .participant-picker{grid-column:1/-1;padding:11px 12px;border:1px dashed var(--line);border-radius:14px;background:#fbf8f1}
    .participant-picker-title{font-size:11px;color:var(--muted);margin-bottom:7px}
    .participant-list{display:flex;gap:8px;flex-wrap:wrap}
    .participant-option{display:inline-flex;align-items:center;gap:6px;padding:7px 10px;border:1px solid var(--line);border-radius:999px;background:#fffefa;cursor:pointer;font-size:12px;user-select:none}
    .participant-option input{accent-color:var(--green)}
    .primary-btn,.ghost-btn,.danger-btn{border:1px solid var(--line);border-radius:12px;padding:10px 13px;cursor:pointer;min-height:42px}
    .primary-btn{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:800}
    .ghost-btn{background:#fffefa;color:var(--ink)}
    .danger-btn{background:#fff4f1;color:#8f4b43;border-color:#e8c8bf}
    .expense-actions{display:flex;gap:8px;justify-content:flex-end;align-items:center}
    .expense-list{margin-top:16px;border-top:1px solid var(--line)}
    .expense-row{display:grid;grid-template-columns:minmax(0,1.6fr) 110px 120px minmax(150px,1.2fr) auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
    .expense-row .name{font-weight:800;min-width:0;overflow-wrap:anywhere}
    .expense-row .meta{font-size:11px;color:var(--muted);margin-top:2px}
    .expense-row .amount{font-weight:900;text-align:right}
    .expense-row .payer,.expense-row .shared{font-size:12px;color:#5f5a52;overflow-wrap:anywhere}
    .expense-row .row-actions{text-align:right;white-space:nowrap}
    .summary-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:14px;margin-top:18px}
    .expense-summary,.settlement-box{border:1px solid var(--line);border-radius:16px;background:#fbf8f1;padding:14px}
    .expense-summary h4,.settlement-box h4{margin:0 0 10px;font-family:Georgia,"Times New Roman","Noto Serif TC",serif;font-size:18px}
    .balance-row{display:grid;grid-template-columns:minmax(0,1fr) 80px 80px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line);font-size:12px}
    .balance-row:last-child{border-bottom:0}
    .balance-row .b-name{font-weight:800;overflow-wrap:anywhere}
    .balance-row .num{text-align:right}
    .positive{color:var(--green);font-weight:900}.negative{color:var(--red);font-weight:900}.zero{color:var(--muted)}
    .settlement-list{display:grid;gap:8px}.settlement-item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 11px;border-radius:12px;background:#fffefa;border:1px solid var(--line);font-size:12px}.settlement-item b{font-size:13px}.settlement-empty{font-size:12px;color:var(--muted)}
    .expense-empty{padding:16px 4px;color:var(--muted);font-size:12px;text-align:center}
    .expense-footer{margin-top:10px;font-size:11px;color:var(--muted);line-height:1.55}
    .overall-badge{display:inline-flex;align-items:center;gap:6px;padding:7px 10px;border-radius:999px;background:#eef1eb;border:1px solid #d6dfd7;color:#4f5d53;font-size:11px}


    /* overall trip ledger */
    .overall-panel .card{margin-bottom:18px}
    .overall-hero{display:grid;grid-template-columns:1.2fr .8fr;gap:16px;align-items:stretch}
    .overall-kicker{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--red);font-weight:900}
    .overall-title{font-family:Georgia,"Times New Roman","Noto Serif TC",serif;font-size:30px;line-height:1.2;margin:6px 0 4px}
    .overall-desc{margin:0;color:var(--muted);font-size:13px}
    .overall-number{display:flex;flex-direction:column;justify-content:center;align-items:flex-end;text-align:right;padding:6px 2px}
    .overall-number b{font-size:34px;line-height:1.1}
    .overall-number span{font-size:11px;color:var(--muted);margin-top:5px}
    .overall-stat-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:16px}
    .overall-stat{background:#faf7f0;border:1px solid var(--line);border-radius:15px;padding:12px}
    .overall-stat b{display:block;font-size:18px}.overall-stat span{font-size:11px;color:var(--muted)}
    .overall-person-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .overall-person{border:1px solid var(--line);border-radius:16px;background:#fffefa;padding:13px}
    .overall-person-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:8px}
    .overall-person-head b{font-size:15px}.overall-person-head span{font-size:11px;color:var(--muted)}
    .overall-mini-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
    .overall-mini{background:#fbf8f1;border:1px solid #e8dfd2;border-radius:11px;padding:8px}
    .overall-mini span{display:block;color:var(--muted);font-size:10px}.overall-mini b{font-size:13px}
    .daily-total-table{width:100%;border-collapse:collapse;font-size:12px}
    .daily-total-table th,.daily-total-table td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left}
    .daily-total-table th:last-child,.daily-total-table td:last-child{text-align:right}
    .daily-total-table tr:last-child td{border-bottom:0}
    .daily-total-table .sum{font-weight:900}
    .overall-settlement-note{background:#eef1eb;border:1px solid #d6dfd7;color:#4f5d53;border-radius:15px;padding:11px 12px;font-size:12px;line-height:1.55;margin-bottom:10px}
    .overall-action-row{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:12px}
    .overall-action-row .ghost-btn{font-size:12px}

    @media (max-width: 680px){
      .overall-hero{grid-template-columns:minmax(0,1fr)}
      .overall-number{align-items:flex-start;text-align:left;padding-top:0}
      .overall-title{font-size:24px}
      .overall-number b{font-size:28px}
      .overall-stat-grid{grid-template-columns:1fr 1fr}
      .overall-stat-grid .overall-stat:last-child{grid-column:1/-1}
      .overall-person-grid{grid-template-columns:minmax(0,1fr)}
      .daily-total-table{font-size:11px}
      .daily-total-table th,.daily-total-table td{padding:8px 4px}
      .overall-action-row{justify-content:stretch}
      .overall-action-row .ghost-btn{flex:1 1 180px}
    }

    /* Responsive refinements */
    @media (max-width: 980px){
      .wrap{padding-left:18px;padding-right:18px}
      .grid{grid-template-columns:minmax(0,1fr);gap:18px}
      .hero{flex-direction:column;align-items:stretch;gap:18px}
      .hero-copy{max-width:none}
      .hero-card{width:100%;min-width:0}
      .side-stack{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
      .map-card{order:-1}
      .expense-form{grid-template-columns:minmax(0,1.2fr) minmax(110px,.7fr);}
      .expense-form .field:nth-child(3){grid-column:1/-1}
      .expense-actions{grid-column:1/-1;justify-content:flex-start}
      .expense-row{grid-template-columns:minmax(0,1.4fr) 100px 90px minmax(120px,1fr) auto}
    }

    @media (max-width: 680px){
      .wrap{padding-left:14px;padding-right:14px}
      header{padding:30px 0 24px}
      .sun{width:200px;height:200px;right:-92px;top:-86px}
      .mountains{left:-80px;right:-80px;bottom:-34px;height:86px}
      h1{font-size:clamp(34px,12vw,48px);letter-spacing:-.045em}
      .lead{font-size:13px;line-height:1.6;margin-top:10px;max-width:36ch}
      .hero-card{padding:14px 16px;border-radius:18px}
      .hero-card .stamp{width:46px;height:46px;font-size:11px;margin-bottom:5px}
      .hero-card strong{font-size:18px}

      .toolbar{top:0}
      .toolbar-inner{gap:7px;padding:9px 0 10px}
      .day-btn{padding:8px 12px;font-size:13px}

      main{padding-top:18px;padding-bottom:54px}
      .card{padding:16px;border-radius:18px}
      .day-title{gap:10px;flex-wrap:wrap;margin-bottom:4px}
      .day-title>div:first-child{min-width:0;flex:1 1 240px}
      .day-title h2{font-size:clamp(21px,6.2vw,27px);overflow-wrap:anywhere}
      .day-title .badge{order:2}
      .sub{font-size:13px}

      .route{margin-top:18px}
      .route:before{left:72px;top:14px;bottom:18px}
      .stop{grid-template-columns:62px minmax(0,1fr);gap:12px;padding-bottom:20px}
      .time{text-align:right;font-size:12px;line-height:1.45;overflow-wrap:anywhere}
      .dot{left:66px;top:0;width:12px;height:12px}
      .stop-body{padding-left:10px;min-width:0}
      .stop-title{font-size:15.5px;line-height:1.4;overflow-wrap:anywhere}
      .stop-note{font-size:13px;line-height:1.55;overflow-wrap:anywhere}
      .tag{font-size:10.5px;padding:3px 7px;margin-top:6px;max-width:100%;white-space:normal}

      .map-head{padding:16px 16px 9px;align-items:flex-start;flex-wrap:wrap}
      .map-head h3{font-size:20px}
      .map-head small{font-size:11px;margin-left:auto}
      .gmaps-wrap{height:auto;aspect-ratio:16/10;min-height:245px;max-height:330px}
      .map-overlay{left:10px;bottom:10px;max-width:calc(100% - 20px);font-size:10px;line-height:1.4;white-space:normal}
      .map-foot{padding:10px 12px 14px;gap:7px;overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none}
      .map-foot::-webkit-scrollbar{display:none}
      .map-link{flex:0 0 auto;white-space:nowrap;font-size:11px;padding:7px 9px}

      .side-stack{grid-template-columns:minmax(0,1fr);gap:14px}
      .side-card h3{font-size:19px}
      .stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
      .stat{padding:10px}
      .stat b{font-size:16px}
      .stat span{font-size:10px}
      .shop{gap:6px}
      .notice{font-size:13px;line-height:1.55}

      .route-strip{gap:6px;overflow-x:auto;padding:4px 1px 5px;scrollbar-width:none}
      .route-strip::-webkit-scrollbar{display:none}
      .route-node{min-width:118px;max-width:150px;padding:9px 10px;font-size:11px;overflow-wrap:anywhere}
      .route-node b{font-size:12px}
      .route-arrow{flex:0 0 auto}
      .map-note{font-size:11px;line-height:1.5}
      .mini-table{font-size:12px}
      .footer{font-size:10.5px;line-height:1.6;padding:0 4px}
      .expense-form{grid-template-columns:minmax(0,1fr) minmax(110px,.65fr);gap:9px}
      .expense-form .field:nth-child(3){grid-column:1/-1}
      .expense-actions{grid-column:1/-1;justify-content:stretch}.expense-actions .primary-btn{width:100%}
      .participant-picker{grid-column:1/-1}
      .summary-grid{grid-template-columns:minmax(0,1fr);gap:10px}
      .expense-row{grid-template-columns:minmax(0,1fr) auto;gap:7px;padding:11px 0}
      .expense-row .payer,.expense-row .shared{font-size:11px}
      .expense-row .amount{grid-column:2;grid-row:1;text-align:right}.expense-row .row-actions{grid-column:2;text-align:right}
      .expense-row > .payer{grid-column:1;grid-row:2}.expense-row > .shared{display:none}
      .expense-footer{font-size:10.5px}
    }

    @media (max-width: 430px){
      .wrap{padding-left:11px;padding-right:11px}
      header{padding-top:26px}
      .eyebrow{font-size:10px;letter-spacing:.18em}
      h1{font-size:36px}
      .hero-card{padding:13px 14px}
      .hero-card strong{font-size:17px}
      .hero-card small{font-size:11.5px;line-height:1.5}

      .toolbar-inner{padding-left:1px;padding-right:1px}
      .day-btn{padding:7px 10px;font-size:12px}

    }

    function googleDirections(places){
      if(!places || places.length < 2) return null;
      const origin = places[0][3];
      const destination = places[places.length-1][3];
      const waypoints = places.slice(1,-1).map(p=>p[3]).join('|');
      let url=`https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(origin)}&destination=${encodeURIComponent(destination)}&travelmode=transit`;
      if(waypoints) url += `&waypoints=${encodeURIComponent(waypoints)}`;
      return url;
    }


    const PEOPLE_KEY='tokyo-trip-people-v1';
    const DEFAULT_PEOPLE=['A','B','C','D'];
    const loadPeople=()=>{
      try{
        const raw=localStorage.getItem(PEOPLE_KEY); const arr=raw?JSON.parse(raw):null;
        return Array.isArray(arr)&&arr.length>=2 ? arr.slice(0,8).map(v=>String(v||'').trim()||'未命名') : [...DEFAULT_PEOPLE];
      }catch{return [...DEFAULT_PEOPLE];}
    };
    let people=loadPeople();
    const savePeople=()=>localStorage.setItem(PEOPLE_KEY,JSON.stringify(people));
    const expenseKey=dayIndex=>`tokyo-expenses-${dayIndex}`;
    const loadExpenses=dayIndex=>{

      catch{return []}
    };

    const money=n=>`¥${Math.round(Number(n)||0).toLocaleString('ja-JP')}`;

      const owed=Object.fromEntries(people.map(p=>[p,0]));

          total+=amount;
          if(paid[e.payer]==null) paid[e.payer]=0;
          paid[e.payer]+=amount;
          const ps=(e.participants||[]).filter(p=>owed[p]!=null);
          if(!ps.length) return;
          const cents=Math.round(amount*100);
          const base=Math.floor(cents/ps.length);
          const rem=cents-base*ps.length;
          ps.forEach((p,i)=>{ owed[p]+=(base+(i<rem?1:0))/100; });
        });
        return {label:d.label,total,count:expenses.length};
      });
      const balances=Object.fromEntries(people.map(p=>[p,(paid[p]||0)-(owed[p]||0)]));
      return {paid,owed,balances,dayTotals};
    }

    function buildSettlementRows(balances){
      const debtors=people.map(p=>[p,Math.max(0,-(balances[p]||0))]).filter(x=>x[1]>0.005).sort((a,b)=>b[1]-a[1]);
      const creditors=people.map(p=>[p,Math.max(0,(balances[p]||0))]).filter(x=>x[1]>0.005).sort((a,b)=>b[1]-a[1]);
      const tx=[]; let i=0,j=0;
      while(i<debtors.length&&j<creditors.length){
        const amt=Math.min(debtors[i][1],creditors[j][1]);
        if(amt>0.005) tx.push({from:debtors[i][0],to:creditors[j][0],amount:Math.round(amt)});
        debtors[i][1]-=amt; creditors[j][1]-=amt;
        if(debtors[i][1]<=0.005)i++;
        if(creditors[j][1]<=0.005)j++;
      }
      return tx;
    }

    function overallLedgerTemplate(){
      return `<section class="panel overall-panel" id="overall-panel">
        <div class="card">
          <div class="overall-hero">
            <div>
              <div class="overall-kicker">TRIP TOTAL</div>
              <div class="overall-title">💰 六天總帳｜旅行結算</div>
              <p class="overall-desc">把 10/14～10/19 每一天的記帳全部加總。每天仍然獨立記錄，這裡只負責看「整趟旅行最後誰要給誰多少」。</p>
            </div>
            <div class="overall-number"><b data-overall-total>¥0</b><span>目前 6 天共同花費</span></div>
          </div>
          <div class="overall-stat-grid">
            <div class="overall-stat"><b data-overall-count>0</b><span>筆記帳</span></div>
            <div class="overall-stat"><b data-overall-average>¥0</b><span>平均每人應分攤</span></div>
            <div class="overall-stat"><b data-overall-people>4 人</b><span>目前成員數</span></div>
          </div>
        </div>

        <div class="card">
          <div class="day-title"><div><div class="eyebrow">FINAL BALANCE</div><h2>整趟旅行結算</h2><p class="sub">「已付」－「應付」＝最後應收／應還</p></div><div class="badge">六天合併</div></div>
          <div class="overall-person-grid" data-overall-people-grid></div>
        </div>

        <div class="grid">
          <div class="card">
            <div class="day-title"><div><div class="eyebrow">SETTLEMENT</div><h2>最後誰要給誰？</h2><p class="sub">系統會用最少轉帳次數，整理成最後結算方式。</p></div></div>
            <div class="overall-settlement-note">這裡和每日結算不同：同一個人今天可能要付錢、明天又是應收，但六天全部合併後，只看最後的淨額。</div>
            <div class="settlement-list" data-overall-settlement></div>
            <div class="overall-action-row"><button type="button" class="ghost-btn" data-copy-settlement>📋 複製結算文字</button><button type="button" class="ghost-btn" data-clear-all-expenses>🗑️ 清除六天記帳</button></div>
          </div>
          <div class="card">
            <div class="day-title"><div><div class="eyebrow">DAY BY DAY</div><h2>每天花多少？</h2><p class="sub">快速確認哪一天花最多。</p></div></div>
            <div data-overall-daily></div>
          </div>
        </div>
      </section>`;
    }

    function expenseTrackerTemplate(dayIndex,label){
      return `<div class="card expense-card" data-expense-day="${dayIndex}">
        <div class="expense-head">
          <div><div class="eyebrow">DAILY EXPENSES</div><h3>💰 ${label}｜今日記帳</h3><p>每一天獨立計算，輸入「誰付錢」＋「哪些人一起分攤」，系統會自動算出最後誰要給誰多少。</p></div>
          <div class="overall-badge">📌 資料只存在這台瀏覽器</div>
        </div>
        <div class="people-editor" data-people-editor></div>
        <div class="expense-form">
          <div class="field"><label>花費項目</label><input type="text" data-field="item" placeholder="例如：晚餐、車資、藥妝"></div>
          <div class="field"><label>金額（日圓）</label><input type="number" data-field="amount" min="0" step="1" placeholder="0"></div>
          <div class="field"><label>誰先付款</label><select data-field="payer"></select></div>
          <div class="expense-actions"><button class="primary-btn" type="button" data-add-expense>＋ 新增</button></div>
          <div class="participant-picker"><div class="participant-picker-title">哪些人要分攤這筆？（預設全員）</div><div class="participant-list" data-participants></div></div>
        </div>
        <div class="expense-list" data-expense-list></div>
        <div class="summary-grid">
          <div class="expense-summary"><h4>今日結算</h4><div data-balance></div></div>
          <div class="settlement-box"><h4>建議怎麼還</h4><div class="settlement-list" data-settlement></div></div>
        </div>
        <div class="expense-footer">算法：每筆花費會平均分給勾選的人；「已付」減掉「應付」就是最後應收／應還。金額以日圓整數計算，若除不盡會自動四捨五入，最終以總額校正。</div>
      </div>`;
    }

    function renderPeopleEditor(root, dayIndex){
      const editor=root.querySelector('[data-people-editor]');
      editor.innerHTML=people.map((name,i)=>`<div class="person-chip"><span>👤</span><input aria-label="成員${i+1}名稱" value="${escapeHtml(name)}" data-person-index="${i}"><button type="button" title="刪除成員" data-remove-person="${i}">×</button></div>`).join('') + (people.length<8?`<button class="ghost-btn" type="button" data-add-person>＋ 成員</button>`:'');
      editor.querySelectorAll('input[data-person-index]').forEach(input=>input.addEventListener('change',e=>{
        const i=Number(e.target.dataset.personIndex); const v=e.target.value.trim()||`成員${i+1}`; people[i]=v; savePeople(); refreshAllExpenseUI();
      }));
      editor.querySelectorAll('[data-remove-person]').forEach(btn=>btn.addEventListener('click',()=>{
        if(people.length<=2){alert('至少保留 2 位成員。');return;}
        const i=Number(btn.dataset.removePerson); const removed=people[i];
        const hasExpense=days.some((_,di)=>loadExpenses(di).some(e=>e.payer===removed||e.participants?.includes(removed)));
        if(hasExpense){ alert(`「${removed}」已經出現在記帳資料中，請先把相關帳目刪除或改成其他成員，再刪除這位成員。`); return; }
        people.splice(i,1); savePeople(); refreshAllExpenseUI();
      }));
      const add=editor.querySelector('[data-add-person]'); if(add) add.addEventListener('click',()=>{
        const next=String.fromCharCode(65+people.length); people.push(next); savePeople(); refreshAllExpenseUI();
      });
    }

    function escapeHtml(v){return String(v).replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));}

    function ensureParticipants(root){
      const wrap=root.querySelector('[data-participants]');
      const old=[...wrap.querySelectorAll('input:checked')].map(x=>x.value);
      const keepAll = old.length===0 || !old.some(v=>people.includes(v));
      wrap.innerHTML=people.map(p=>`<label class="participant-option"><input type="checkbox" value="${escapeHtml(p)}" ${keepAll||old.includes(p)?'checked':''}>${escapeHtml(p)}</label>`).join('');
    }

    function renderExpenseRows(root,dayIndex){
      const list=root.querySelector('[data-expense-list]'); const expenses=loadExpenses(dayIndex);
      if(!expenses.length){list.innerHTML='<div class="expense-empty">今天還沒有記帳，先新增第一筆吧 ✍️</div>';return;}
      list.innerHTML=expenses.map((e,idx)=>`<div class="expense-row">
        <div><div class="name">${escapeHtml(e.item||'未命名')}</div><div class="meta">${escapeHtml(e.participants.join('、'))} 分攤</div></div>
        <div class="payer">由 <b>${escapeHtml(e.payer)}</b> 先付</div>
        <div class="shared">${e.participants.length} 人</div>
        <div class="amount">${money(e.amount)}</div>
        <div class="row-actions"><button class="danger-btn" type="button" data-delete-expense="${idx}">刪除</button></div>
      </div>`).join('');
      list.querySelectorAll('[data-delete-expense]').forEach(btn=>btn.addEventListener('click',()=>{
        const arr=loadExpenses(dayIndex); arr.splice(Number(btn.dataset.deleteExpense),1); saveExpenses(dayIndex,arr); renderExpenseDay(dayIndex);
      }));
    }

    function calcBalances(dayIndex){
      const expenses=loadExpenses(dayIndex); const paid=Object.fromEntries(people.map(p=>[p,0])); const owed=Object.fromEntries(people.map(p=>[p,0]));
      expenses.forEach(e=>{ const amount=Number(e.amount)||0; if(paid[e.payer]==null) paid[e.payer]=0; paid[e.payer]+=amount; const ps=(e.participants||[]).filter(p=>owed[p]!=null); if(!ps.length)return; const cents=Math.round(amount*100); const base=Math.floor(cents/ps.length); let rem=cents-base*ps.length; ps.forEach((p,i)=>{owed[p]+= (base+(i<rem?1:0))/100;}); });
      const balances=Object.fromEntries(people.map(p=>[p,(paid[p]||0)-(owed[p]||0)]));
      return {paid,owed,balances};
    }

    function renderSummary(root,dayIndex){
      const {paid,owed,balances}=calcBalances(dayIndex); const balanceBox=root.querySelector('[data-balance]');
      balanceBox.innerHTML=people.map(p=>{const b=balances[p]||0; const cls=b>0.5?'positive':b<-0.5?'negative':'zero'; const label=b>0.5?'應收':b<-0.5?'應付':'已結清'; return `<div class="balance-row"><div class="b-name">${escapeHtml(p)} <span class="sub">${label}</span></div><div class="num">付 ${money(paid[p]||0)}</div><div class="num ${cls}">${b>0?'+':''}${money(b)}</div></div>`}).join('');
      const list=root.querySelector('[data-settlement]'); const debtors=people.map(p=>[p,Math.max(0,-balances[p])]).filter(x=>x[1]>0.005).sort((a,b)=>b[1]-a[1]); const creditors=people.map(p=>[p,Math.max(0,balances[p])]).filter(x=>x[1]>0.005).sort((a,b)=>b[1]-a[1]); const tx=[]; let i=0,j=0;
      while(i<debtors.length&&j<creditors.length){const amt=Math.min(debtors[i][1],creditors[j][1]); if(amt>0.005) tx.push(`<div class="settlement-item"><span><b>${escapeHtml(debtors[i][0])}</b> → <b>${escapeHtml(creditors[j][0])}</b></span><b>${money(amt)}</b></div>`); debtors[i][1]-=amt; creditors[j][1]-=amt; if(debtors[i][1]<=0.005)i++; if(creditors[j][1]<=0.005)j++;}
      list.innerHTML=tx.length?tx.join(''):'<div class="settlement-empty">今天不用互相還錢，剛好打平 ✨</div>';
    }

    function renderExpenseDay(dayIndex){
      const root=document.querySelector(`[data-expense-day="${dayIndex}"]`); if(!root)return;
      renderPeopleEditor(root,dayIndex); ensureParticipants(root);
      const payer=root.querySelector('[data-field="payer"]'); const current=payer.value; payer.innerHTML=people.map(p=>`<option value="${escapeHtml(p)}">${escapeHtml(p)}</option>`).join(''); if(people.includes(current)) payer.value=current;
      renderExpenseRows(root,dayIndex); renderSummary(root,dayIndex);
      const add=root.querySelector('[data-add-expense]'); add.onclick=()=>{
        const item=root.querySelector('[data-field="item"]').value.trim(); const amount=Math.round(Number(root.querySelector('[data-field="amount"]').value)||0); const p=root.querySelector('[data-field="payer"]').value; const participants=[...root.querySelectorAll('[data-participants] input:checked')].map(x=>x.value);
        if(!item){alert('請先填寫花費項目。');return;} if(!amount||amount<0){alert('請輸入正確的金額。');return;} if(!p){alert('請選擇付款人。');return;} if(!participants.length){alert('至少選 1 位分攤者。');return;}
        const arr=loadExpenses(dayIndex); arr.push({item,amount,payer:p,participants,createdAt:Date.now()}); saveExpenses(dayIndex,arr); root.querySelector('[data-field="item"]').value=''; root.querySelector('[data-field="amount"]').value=''; renderExpenseDay(dayIndex);
      };
    }

    function renderOverall(){
      const panel=document.getElementById('overall-panel');
      if(!panel)return;
      const {paid,owed,balances,dayTotals}=calcCombinedBalances();
      const total=dayTotals.reduce((sum,d)=>sum+d.total,0);
      const count=dayTotals.reduce((sum,d)=>sum+d.count,0);
      panel.querySelector('[data-overall-total]').textContent=money(total);
      panel.querySelector('[data-overall-count]').textContent=count;
      panel.querySelector('[data-overall-average]').textContent=money(people.length?total/people.length:0);
      panel.querySelector('[data-overall-people]').textContent=`${people.length} 人`;

      panel.querySelector('[data-overall-people-grid]').innerHTML=people.map(p=>{
        const b=balances[p]||0;
        const cls=b>0.5?'positive':b<-0.5?'negative':'zero';
        const label=b>0.5?'應收':b<-0.5?'應付':'已結清';
        return `<div class="overall-person"><div class="overall-person-head"><b>${escapeHtml(p)}</b><span class="${cls}">${label} ${b>0?'+':''}${money(b)}</span></div><div class="overall-mini-grid"><div class="overall-mini"><span>總共已付</span><b>${money(paid[p]||0)}</b></div><div class="overall-mini"><span>總共應付</span><b>${money(owed[p]||0)}</b></div></div></div>`;
      }).join('');

      const tx=buildSettlementRows(balances);
      const settlement=panel.querySelector('[data-overall-settlement]');
      settlement.innerHTML=tx.length?tx.map(t=>`<div class="settlement-item"><span><b>${escapeHtml(t.from)}</b> → <b>${escapeHtml(t.to)}</b></span><b>${money(t.amount)}</b></div>`).join(''):'<div class="settlement-empty">目前沒有需要互相還錢的帳目，整趟剛好打平 ✨</div>';

      const daily=panel.querySelector('[data-overall-daily]');
      daily.innerHTML=`<table class="daily-total-table"><thead><tr><th>日期</th><th>筆數</th><th>總花費</th></tr></thead><tbody>${dayTotals.map(d=>`<tr><td>${escapeHtml(d.label)}</td><td>${d.count}</td><td class="sum">${money(d.total)}</td></tr>`).join('')}</tbody></table>`;

      const copyBtn=panel.querySelector('[data-copy-settlement]');
      copyBtn.onclick=async()=>{
        const text=tx.length?['東京 6 天旅行｜最終結算',...tx.map(t=>`${t.from} → ${t.to} ${money(t.amount)}`)].join('\n'):'東京 6 天旅行｜目前沒有需要互相還錢的帳目。';
        try{await navigator.clipboard.writeText(text);alert('已複製六天總結算！');}
        catch{alert(text);}
      };
      const clearBtn=panel.querySelector('[data-clear-all-expenses]');
      clearBtn.onclick=()=>{
        if(!confirm('確定要清除 10/14～10/19 的全部記帳嗎？這個動作會刪除六天的帳目，但不會影響行程。')) return;
        days.forEach((_,i)=>localStorage.removeItem(expenseKey(i)));
        refreshAllExpenseUI();
      };
    }

    function refreshAllExpenseUI(){days.forEach((_,i)=>renderExpenseDay(i)); renderOverall();}

    const overallButton=document.createElement('button');
    overallButton.className='day-btn';
    overallButton.textContent='💰 六天總帳';
    dayNav.appendChild(overallButton);
    panels.insertAdjacentHTML('beforeend', overallLedgerTemplate());
    overallButton.addEventListener('click',showOverall);

    days.forEach((d,i)=>{
      const btn=document.createElement('button');
      btn.className='day-btn'+(i===0?' active':'');
      btn.textContent=d.label;
      btn.addEventListener('click',()=>showDay(i));
      dayNav.appendChild(btn);

      const panel=document.createElement('section');
      panel.className='panel'+(i===0?' active':'');
      panel.id='day-'+i;
      panel.innerHTML=`
        <div class="grid">
          <div>
            <div class="card">
              <div class="day-title"><div><div class="eyebrow">${d.color}</div><h2>${d.title}</h2><p class="sub">依目前共識整理｜點日期切換</p></div><div class="badge">10月 ${14+i} 日</div></div>
              <div class="route">${d.route.map(s=>`<div class="stop"><div class="time">${s[0]}</div><div class="dot"></div><div class="stop-body"><div class="stop-title">${s[1]}</div><div class="stop-note">${s[2]}</div><span class="tag">${s[3]}</span></div></div>`).join('')}</div>
            </div>
            <div class="card map-card">
              <div class="map-head"><div><div class="eyebrow">DAY MAP</div><h3>今天去哪裡？</h3></div><small>${d.places.length} 個主要地點</small></div>
              <div class="gmaps-wrap">
                <iframe src="${googleEmbed(d.embed || d.places[0][3], d.zoom || 13)}" title="${d.label} Google Maps" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>
                <div class="map-overlay">Google Maps｜可縮放、拖曳、查看街景</div>
              </div>
              <div class="map-foot">${d.links.map(([name,url])=>`<a class="map-link" href="${googleSearch(url)}" target="_blank" rel="noopener">↗ ${name}</a>`).join('')}${googleDirections(d.places)?`<a class="map-link" href="${googleDirections(d.places)}" target="_blank" rel="noopener">🗺️ 開啟今日路線</a>`:''}</div>
            </div>
          </div>
          <div class="side-stack">${d.side}
            <div class="card side-card"><h3>今日地圖動線</h3><div class="route-strip">${d.places.map((p,idx)=>`${idx?'<span class="route-arrow">→</span>':''}<div class="route-node"><b>${idx+1}. ${p[0]}</b>${p[3]}</div>`).join('')}</div><div class="map-note">地圖直接使用 Google Maps；下方按鈕可開啟各景點或整天的即時路線。</div></div>
          </div>
        </div>
        ${expenseTrackerTemplate(i, d.label)}
      `;
      panels.appendChild(panel);
    });


    // Build each day's independent expense ledger and restore saved data.
    setTimeout(()=>refreshAllExpenseUI(),0);

    function setActiveNav(index){
      [...dayNav.children].forEach((b,j)=>b.classList.toggle('active',j===index));
    }

    function showDay(i){
      document.querySelectorAll('.panel').forEach((p,j)=>p.classList.toggle('active',j===i+1));
      setActiveNav(i+1);
      window.scrollTo({top:0,behavior:'smooth'});
    }

    function showOverall(){
      document.querySelectorAll('.panel').forEach((p)=>p.classList.remove('active'));
      const panel=document.getElementById('overall-panel');
      if(panel){panel.classList.add('active'); renderOverall();}
      setActiveNav(0);
      window.scrollTo({top:0,behavior:'smooth'});
    }

    // Persist checklist state locally in browser.
    document.addEventListener('change',e=>{
      if(e.target.matches('.check input')){
        const key=e.target.dataset.key; if(!key) return;
        localStorage.setItem('tokyo-check-'+key,e.target.checked?'1':'0');
        e.target.closest('.check').classList.toggle('done',e.target.checked);
      }
    });
    document.addEventListener('DOMContentLoaded',()=>{
      document.querySelectorAll('.check input[data-key]').forEach(input=>{
        const done=localStorage.getItem('tokyo-check-'+input.dataset.key)==='1';
        input.checked=done; input.closest('.check').classList.toggle('done',done);
      });
    });
  </script>
</body>
</html>
