<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f5efe4" />
  <title>東京 6天5夜｜2026.10.14–10.19</title>
  <style>
    :root{
      --paper:#f5efe4; --paper2:#fbf8f1; --card:#fffdf8; --ink:#28251f; --muted:#7a756d;
      --line:#ded5c7; --red:#9d4b43; --red2:#ba695d; --green:#54685b; --blue:#5e7077;
      --shadow:0 12px 32px rgba(52,42,28,.09); --radius:22px;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;color:var(--ink);background:
      radial-gradient(circle at 15% 10%,rgba(157,75,67,.05),transparent 22%),
      radial-gradient(circle at 85% 28%,rgba(84,104,91,.06),transparent 24%),
      linear-gradient(180deg,#f8f2e7 0%,var(--paper) 48%,#f1eadf 100%);
      font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.65}
    a{color:inherit;text-decoration:none}
    button{font:inherit}
    .wrap{max-width:1220px;margin:auto;padding:0 22px}

    /* Japanese travel postcard hero */
    header{position:relative;overflow:hidden;background:#ebe4d7;border-bottom:1px solid var(--line);padding:44px 0 34px}
    .sun{position:absolute;width:260px;height:260px;border-radius:50%;right:-70px;top:-95px;background:rgba(157,75,67,.10);box-shadow:0 0 0 18px rgba(157,75,67,.04),0 0 0 40px rgba(157,75,67,.025)}
    .mountains{position:absolute;left:-40px;right:-40px;bottom:-46px;height:120px;opacity:.16;background:linear-gradient(135deg,transparent 0 30%,#7d8d80 30% 54%,transparent 54% 100%),linear-gradient(30deg,transparent 0 48%,#8a6e61 48% 70%,transparent 70% 100%);transform:skewX(-18deg)}
    .hero{display:flex;justify-content:space-between;gap:28px;align-items:flex-end;position:relative;z-index:1}
    .hero-copy{max-width:760px}
    .eyebrow{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--red);font-weight:800;margin-bottom:8px}
    h1{font-family:Georgia,"Times New Roman","Noto Serif TC",serif;margin:0;font-size:clamp(36px,6vw,66px);line-height:1.05;letter-spacing:-.03em}
    .lead{margin:12px 0 0;color:#5e5a53;font-size:15px}
    .hero-card{min-width:280px;background:rgba(255,253,248,.76);border:1px solid rgba(127,109,88,.2);backdrop-filter:blur(10px);border-radius:24px;padding:18px 20px;box-shadow:var(--shadow)}
    .hero-card .stamp{display:inline-flex;align-items:center;justify-content:center;width:54px;height:54px;border:2px solid var(--red);border-radius:50%;color:var(--red);font-weight:900;transform:rotate(-8deg);margin-bottom:8px;font-size:12px}
    .hero-card strong{display:block;font-size:21px;letter-spacing:.03em}.hero-card small{display:block;color:var(--muted);margin-top:2px}

    /* sticky day nav */
    .toolbar{position:sticky;top:0;z-index:30;background:rgba(248,242,231,.9);backdrop-filter:blur(12px);border-bottom:1px solid rgba(222,213,199,.9)}
    .toolbar-inner{display:flex;gap:8px;overflow:auto;padding:12px 0;scrollbar-width:none}.toolbar-inner::-webkit-scrollbar{display:none}
    .day-btn{border:1px solid var(--line);background:rgba(255,253,248,.9);color:var(--ink);padding:10px 14px;border-radius:999px;white-space:nowrap;cursor:pointer;transition:.2s;box-shadow:0 2px 0 rgba(0,0,0,.02)}
    .day-btn:hover{transform:translateY(-1px)} .day-btn.active{background:var(--ink);color:#fff;border-color:var(--ink)}

    main{padding:26px 0 70px}.panel{display:none}.panel.active{display:block}.grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(320px,.75fr);gap:22px}
    .card{background:rgba(255,253,248,.94);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px}
    .card + .card{margin-top:18px}
    .day-title{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:8px}.day-title h2{font-family:Georgia,"Times New Roman","Noto Serif TC",serif;margin:0;font-size:30px;line-height:1.2}.sub{color:var(--muted);font-size:14px}.badge{white-space:nowrap;background:#eee7db;border:1px solid #dfd4c6;padding:5px 10px;border-radius:999px;font-size:12px;color:#61594f}

    /* timeline */
    .route{position:relative;margin-top:20px}.route:before{content:"";position:absolute;left:101px;top:17px;bottom:22px;width:1px;background:var(--line)}
    .stop{display:grid;grid-template-columns:90px 1fr;gap:24px;position:relative;padding:0 0 24px}.time{font-size:13px;font-weight:800;color:var(--red);padding-top:2px;text-align:right;letter-spacing:.01em}.dot{position:absolute;left:95px;top:2px;width:13px;height:13px;border:3px solid var(--ink);background:var(--card);border-radius:50%;z-index:2}.stop-body{padding-left:10px}.stop-title{font-size:17px;font-weight:800}.stop-note{font-size:14px;color:#625e57;margin-top:2px}.tag{display:inline-block;background:#f2ece2;border:1px solid #e4dacb;border-radius:999px;padding:3px 8px;font-size:11px;margin:7px 6px 0 0;color:#685f53}

    /* map */
    .map-card{padding:0;overflow:hidden}.map-head{padding:18px 20px 10px;display:flex;justify-content:space-between;gap:12px;align-items:flex-end}.map-head h3{margin:0;font-family:Georgia,"Times New Roman","Noto Serif TC",serif;font-size:22px}.map-head small{color:var(--muted)}
    .gmaps-wrap{position:relative;width:100%;height:360px;background:#e9e3d9}.gmaps-wrap iframe{width:100%;height:100%;border:0;display:block}.map-overlay{position:absolute;left:14px;bottom:14px;z-index:2;background:rgba(255,253,248,.94);border:1px solid rgba(127,109,88,.2);border-radius:999px;padding:7px 10px;font-size:11px;color:var(--muted);box-shadow:0 4px 12px rgba(52,42,28,.08);pointer-events:none}
    .map-foot{padding:12px 16px 16px;display:flex;gap:8px;flex-wrap:wrap}.map-link{display:inline-flex;align-items:center;gap:6px;padding:8px 10px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:12px}.map-link:hover{border-color:#b8a894;background:#fbf8f1}

    .side-stack{display:grid;gap:18px;align-content:start}.side-card h3{margin:0 0 10px;font-family:Georgia,"Times New Roman","Noto Serif TC",serif;font-size:21px}.side-card p{margin:6px 0}.notice{background:#faf0ea;border:1px solid #e7cbc1;color:#69423b;border-radius:16px;padding:13px 14px;font-size:14px}.soft{background:#eef1eb;border-color:#d6dfd7;color:#4f5d53}
    .checklist{display:grid;gap:9px;margin-top:10px}.check{display:flex;align-items:flex-start;gap:9px;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:#fffefa}.check input{margin-top:4px;accent-color:var(--green)} .check.done{text-decoration:line-through;color:#969087;background:#f5f2eb}
    .shop{display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px 0;border-bottom:1px dashed var(--line)}.shop:last-child{border-bottom:0}.pill{font-size:11px;padding:4px 8px;border-radius:999px;background:#f0ebe2;color:#635b50;white-space:nowrap}
    .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{background:#faf7f0;border:1px solid var(--line);border-radius:15px;padding:12px}.stat b{display:block;font-size:18px}.stat span{font-size:11px;color:var(--muted)}
    .mini-table{width:100%;border-collapse:collapse;font-size:13px}.mini-table td{padding:8px 2px;border-bottom:1px solid var(--line)}.mini-table td:last-child{text-align:right;font-weight:800}
    .footer{color:var(--muted);font-size:12px;text-align:center;margin-top:30px}

    /* route strip */
    .route-strip{display:flex;align-items:center;gap:7px;overflow:auto;padding:5px 2px 2px;scrollbar-width:none}.route-strip::-webkit-scrollbar{display:none}.route-node{min-width:112px;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:#fffcf7;font-size:12px}.route-node b{display:block;font-size:13px}.route-arrow{color:#a08f7e;font-size:16px}
    .map-note{font-size:12px;color:var(--muted);margin-top:8px}

    @media(max-width:980px){.grid{grid-template-columns:1fr}.hero{flex-direction:column;align-items:flex-start}.hero-card{width:100%;min-width:0}.side-stack{grid-template-columns:1fr 1fr}.map-card{order:-1}}
    @media(max-width:680px){.wrap{padding:0 14px}header{padding-top:34px}.hero-card{padding:15px}.card{padding:17px}.day-title{align-items:flex-start}.day-title h2{font-size:25px}.badge{font-size:11px}.route:before{left:80px}.stop{grid-template-columns:70px 1fr;gap:17px}.dot{left:74px}.stop-title{font-size:16px}.side-stack{grid-template-columns:1fr}.gmaps-wrap{height:310px}.hero h1{font-size:42px}}
  </style>
</head>

          ['22:30 左右','神田集合','四人會合','🍢 再一起找居酒屋／宵夜']
        ],
        places:[['Sunshine City',35.7287,139.7195,'Sunshine City'],['RODEO CROWNS',35.7287,139.7195,'Sunshine City Alpa'],['HOKA Harajuku',35.6701,139.7024,'HOKA Harajuku'],['Mizuno Harajuku',35.6695,139.7056,'Mizuno Harajuku'],['Shibuya',35.6595,139.7005,'澀谷'],['Roppongi',35.6628,139.7314,'六本木']],
        embed:'Sunshine City 池袋', zoom:13,
        links:[['Sunshine City','https://www.google.com/maps/search/?api=1&query=Sunshine+City+Ikebukuro'],['RODEO CROWNS','https://www.google.com/maps/search/?api=1&query=RODEO+CROWNS+Sunshine+City+Ikebukuro'],['HOKA Harajuku','https://www.google.com/maps/search/?api=1&query=HOKA+Harajuku'],['Mizuno Harajuku','https://www.google.com/maps/search/?api=1&query=Mizuno+Harajuku'],['澀谷','https://www.google.com/maps/search/?api=1&query=Shibuya+Tokyo'],['六本木','https://www.google.com/maps/search/?api=1&query=Roppongi+Tokyo']],
        side:`
          <div class="card side-card"><h3>採購優先順序</h3><div class="shop"><span>RODEO CROWNS</span><span class="pill">池袋</span></div><div class="shop"><span>HOKA</span><span class="pill">原宿</span></div><div class="shop"><span>大國藥妝</span><span class="pill">澀谷備選</span></div><div class="shop"><span>唐吉訶德</span><span class="pill">10/16 已先買</span></div></div>

      {

        route:[

        ],
        places:[['Tokyo Station',35.6812,139.7671,'東京站'],['Yurakucho',35.6749,139.7626,'有樂町'],['Kanda',35.6917,139.7709,'神田'],['Narita Airport',35.7719,140.3929,'成田機場']],

    const dayNav = document.getElementById('dayNav');
    const panels = document.getElementById('panels');
    function googleSearch(url){ return url; }

    function googleEmbed(query, zoom=13){
      return `https://www.google.com/maps?q=${encodeURIComponent(query)}&z=${zoom}&output=embed`;
    }

    function googleDirections(places){
      if(!places || places.length < 2) return null;
      const origin = places[0][3];
      const destination = places[places.length-1][3];
      const waypoints = places.slice(1,-1).map(p=>p[3]).join('|');
      let url=`https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(origin)}&destination=${encodeURIComponent(destination)}&travelmode=transit`;
      if(waypoints) url += `&waypoints=${encodeURIComponent(waypoints)}`;
      return url;
    }

    days.forEach((d,i)=>{
      const btn=document.createElement('button');
      btn.className='day-btn'+(i===0?' active':'');
      btn.textContent=d.label;
      btn.addEventListener('click',()=>showDay(i));
      dayNav.appendChild(btn);

      const panel=document.createElement('section');
      panel.className='panel'+(i===0?' active':'');
      panel.id='day-'+i;
      panel.innerHTML=`
        <div class="grid">
          <div>
            <div class="card">
              <div class="day-title"><div><div class="eyebrow">${d.color}</div><h2>${d.title}</h2><p class="sub">依目前共識整理｜點日期切換</p></div><div class="badge">10月 ${14+i} 日</div></div>
              <div class="route">${d.route.map(s=>`<div class="stop"><div class="time">${s[0]}</div><div class="dot"></div><div class="stop-body"><div class="stop-title">${s[1]}</div><div class="stop-note">${s[2]}</div><span class="tag">${s[3]}</span></div></div>`).join('')}</div>
            </div>
            <div class="card map-card">
              <div class="map-head"><div><div class="eyebrow">DAY MAP</div><h3>今天去哪裡？</h3></div><small>${d.places.length} 個主要地點</small></div>
              <div class="gmaps-wrap">
                <iframe src="${googleEmbed(d.embed || d.places[0][3], d.zoom || 13)}" title="${d.label} Google Maps" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>
                <div class="map-overlay">Google Maps｜可縮放、拖曳、查看街景</div>
              </div>
              <div class="map-foot">${d.links.map(([name,url])=>`<a class="map-link" href="${googleSearch(url)}" target="_blank" rel="noopener">↗ ${name}</a>`).join('')}${googleDirections(d.places)?`<a class="map-link" href="${googleDirections(d.places)}" target="_blank" rel="noopener">🗺️ 開啟今日路線</a>`:''}</div>
            </div>
          </div>
          <div class="side-stack">${d.side}
            <div class="card side-card"><h3>今日地圖動線</h3><div class="route-strip">${d.places.map((p,idx)=>`${idx?'<span class="route-arrow">→</span>':''}<div class="route-node"><b>${idx+1}. ${p[0]}</b>${p[3]}</div>`).join('')}</div><div class="map-note">地圖直接使用 Google Maps；下方按鈕可開啟各景點或整天的即時路線。</div></div>
          </div>
        </div>`;
      panels.appendChild(panel);
    });

    function showDay(i){
      document.querySelectorAll('.panel').forEach((p,j)=>p.classList.toggle('active',j===i));
      [...dayNav.children].forEach((b,j)=>b.classList.toggle('active',j===i));
      window.scrollTo({top:0,behavior:'smooth'});
    }

    // Persist checklist state locally in browser.
    document.addEventListener('change',e=>{
      if(e.target.matches('.check input')){
        const key=e.target.dataset.key; if(!key) return;
        localStorage.setItem('tokyo-check-'+key,e.target.checked?'1':'0');
        e.target.closest('.check').classList.toggle('done',e.target.checked);
      }
    });
    document.addEventListener('DOMContentLoaded',()=>{
      document.querySelectorAll('.check input[data-key]').forEach(input=>{
        const done=localStorage.getItem('tokyo-check-'+input.dataset.key)==='1';
        input.checked=done; input.closest('.check').classList.toggle('done',done);
      });
    });
  </script>
</body>
